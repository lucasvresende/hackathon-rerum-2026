[package]
name = "feed-your-cow"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
maud = { version = "0.27", features = ["axum"] }
microlp = "0.6"
rust_decimal = { version = "1", features = ["serde-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "sqlite", "macros", "migrate",
] }
tokio = { version = "1", features = [
    "macros", "rt-multi-thread", "net", "signal", "process", "time", "io-util",
] }
tower-http = { version = "0.6", features = ["trace", "fs", "limit"] }
tower-livereload = { version = "0.10", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[features]
desenvolvimento = ["dep:tower-livereload"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
